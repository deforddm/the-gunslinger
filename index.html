const A={ctx:null,amb:null,ambName:"",
 init(){if(this.ctx)return;try{this.ctx=new (window.AudioContext||window.webkitAudioContext)();this.master=this.ctx.createGain();this.master.gain.value=st.sound?.55:0;this.master.connect(this.ctx.destination);const n=this.ctx.sampleRate*2,b=this.ctx.createBuffer(1,n,this.ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;this.noise=b}catch(e){this.ctx=null}},
 mute(on){if(this.master)this.master.gain.setTargetAtTime(on?.55:0,this.ctx.currentTime,.1)},
 src(){const s=this.ctx.createBufferSource();s.buffer=this.noise;s.loop=true;return s},
 stopAmb(){if(!this.amb)return;const a=this.amb;this.amb=null;try{a.g.gain.setTargetAtTime(0,this.ctx.currentTime,.5);setTimeout(()=>{a.stop()},1800)}catch(e){}},
 play(name){if(!this.ctx||name===this.ambName)return;this.ambName=name;this.stopAmb();if(name==="none")return;
  const c=this.ctx,g=c.createGain();g.gain.value=0;g.connect(this.master);const nodes=[];let timer=null;
  if(name==="wind"||name==="storm"){const s=this.src(),f=c.createBiquadFilter();f.type="bandpass";f.frequency.value=name==="storm"?700:420;f.Q.value=.7;const lfo=c.createOscillator(),lg=c.createGain();lfo.frequency.value=.09;lg.gain.value=name==="storm"?300:180;lfo.connect(lg);lg.connect(f.frequency);s.connect(f);f.connect(g);s.start();lfo.start();nodes.push(s,lfo);g.gain.setTargetAtTime(name==="storm"?.5:.28,c.currentTime,1.2)}
  if(name==="fire"){const s=this.src(),f=c.createBiquadFilter();f.type="lowpass";f.frequency.value=380;s.connect(f);f.connect(g);s.start();nodes.push(s);g.gain.setTargetAtTime(.12,c.currentTime,1);
   timer=setInterval(()=>{if(Math.random()<.55)this.pop(.05+Math.random()*.08)},230)}
  if(name==="piano"){const s=this.src(),f=c.createBiquadFilter();f.type="lowpass";f.frequency.value=300;s.connect(f);f.connect(g);s.start();nodes.push(s);g.gain.setTargetAtTime(.05,c.currentTime,1);
   const notes=[196,220,247,262,294,330,349,392,440];timer=setInterval(()=>{if(Math.random()<.6)this.key(notes[Math.floor(Math.random()*notes.length)]*(Math.random()<.3?.5:1))},420)}
  this.amb={g,stop:()=>{nodes.forEach(n=>{try{n.stop()}catch(e){}});if(timer)clearInterval(timer)}}},
 pop(v){const c=this.ctx,s=c.createBufferSource();s.buffer=this.noise;const f=c.createBiquadFilter();f.type="highpass";f.frequency.value=1500;const g=c.createGain();g.gain.value=v;g.gain.setTargetAtTime(0,c.currentTime+.01,.02);s.connect(f);f.connect(g);g.connect(this.master);s.start(0,Math.random()*1.5,.12)},
 key(fr){const c=this.ctx,o=c.createOscillator(),f=c.createBiquadFilter(),g=c.createGain();o.type="triangle";o.frequency.value=fr;f.type="lowpass";f.frequency.value=700;g.gain.value=0;g.gain.setTargetAtTime(.09,c.currentTime,.005);g.gain.setTargetAtTime(0,c.currentTime+.08,.35);o.connect(f);f.connect(g);g.connect(this.master);o.start();o.stop(c.currentTime+1.6)},
 shot(){if(!this.ctx)return;const c=this.ctx,t=c.currentTime,s=c.createBufferSource();s.buffer=this.noise;const f=c.createBiquadFilter();f.type="lowpass";f.frequency.value=2400;const g=c.createGain();g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.001,t+.35);s.connect(f);f.connect(g);g.connect(this.master);s.start(t,Math.random(),.4);
  const o=c.createOscillator(),og=c.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(40,t+.2);og.gain.setValueAtTime(.7,t);og.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(og);og.connect(this.master);o.start(t);o.stop(t+.3)},
 click(){if(!this.ctx)return;this.pop(.25)}
};

function setArt(k){if(k===artKey)return;artKey=k;const host=$("art");const old=host.querySelector(".layer");const d=document.createElement("div");d.className="layer fade";d.style.cssText="position:absolute;inset:0;opacity:0";d.innerHTML=ART[k]();host.insertBefore(d,$("memTag"));requestAnimationFrame(()=>{d.style.opacity=1});if(old){old.style.opacity=0;setTimeout(()=>old.remove(),950)}animateArt(d,k)}
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
function animateArt(d,k){if(RM)return;if(k==="storm"){const g=d.querySelector(".streaks");let x=0;const f=()=>{if(!d.isConnected)return;x=(x+6)%500;g.setAttribute("transform",`translate(${-x} 0)`);requestAnimationFrame(f)};f()}}

 "CR-4":"He fell from a corner in New York in 1977. Keep the year.",

A.play=function(name){if(!this.ctx||name===this.ambName)return;this.ambName=name;this.stopAmb();if(name==="none")return;
 const c=this.ctx,g=c.createGain();g.gain.value=0;g.connect(this.master);const nodes=[];const timers=[];
 const noise=(type,freq,q)=>{const s=this.src(),f=c.createBiquadFilter();f.type=type;f.frequency.value=freq;if(q)f.Q.value=q;s.connect(f);f.connect(g);s.start();nodes.push(s);return f};
 const osc=(fr,type,gain)=>{const o=c.createOscillator(),og=c.createGain();o.type=type||"sine";o.frequency.value=fr;og.gain.value=gain;o.connect(og);og.connect(g);o.start();nodes.push(o);return og};
 const lfo=(target,rate,depth)=>{const l=c.createOscillator(),lg=c.createGain();l.frequency.value=rate;lg.gain.value=depth;l.connect(lg);lg.connect(target);l.start();nodes.push(l)};
 let lvl=.25;
 if(name==="wind"||name==="storm"){const f=noise("bandpass",name==="storm"?700:420,.7);lfo(f.frequency,.09,name==="storm"?300:180);lvl=name==="storm"?.5:.28}
 if(name==="fire"){noise("lowpass",380);lvl=.12;timers.push(setInterval(()=>{if(Math.random()<.55)this.pop(.05+Math.random()*.08)},230))}
 if(name==="piano"){noise("lowpass",300);lvl=.05;const notes=[196,220,247,262,294,330,349,392,440];timers.push(setInterval(()=>{if(Math.random()<.6)this.key(notes[Math.floor(Math.random()*notes.length)]*(Math.random()<.3?.5:1))},420))}
 if(name==="birds"){const f=noise("bandpass",380,.6);lfo(f.frequency,.06,120);lvl=.14;timers.push(setInterval(()=>{if(Math.random()<.35)this.chirp()},700))}
 if(name==="drone"){osc(55,"sine",.5);const o2=osc(82.4,"triangle",.18);lfo(o2.gain,.07,.15);lvl=.22}
 if(name==="drip"){noise("lowpass",160);lvl=.2;timers.push(setInterval(()=>{if(Math.random()<.4)this.drip()},600))}
 if(name==="pump"){osc(60,"square",.03);noise("bandpass",2200,2);lvl=.18}
 if(name==="rails"){noise("lowpass",260);lvl=.2;let n=0;timers.push(setInterval(()=>{n++;this.pop(n%2?.18:.12)},260))}
 if(name==="strings"){lvl=.2;const ch=[[220,277,330],[196,247,294],[175,220,262]];let i=0;const play=()=>{ch[i++%3].forEach(f=>this.pad(f))};play();timers.push(setInterval(play,3200))}
 if(name==="river"){noise("lowpass",500);lvl=.35}
 if(name==="sea"){const f=noise("lowpass",700);lvl=.3;const sw=c.createGain();g.disconnect();g.connect(sw);sw.connect(this.master);sw.gain.value=.6;lfo(sw.gain,.08,.4)}
 g.gain.setTargetAtTime(lvl,c.currentTime,1);
 this.amb={g,stop:()=>{nodes.forEach(n=>{try{n.stop()}catch(e){}});timers.forEach(clearInterval)}}};
A.chirp=function(){const c=this.ctx,o=c.createOscillator(),g=c.createGain(),t=c.currentTime;o.frequency.setValueAtTime(2600+Math.random()*900,t);o.frequency.exponentialRampToValueAtTime(1800,t+.12);g.gain.setValueAtTime(.04,t);g.gain.exponentialRampToValueAtTime(.001,t+.14);o.connect(g);g.connect(this.master);o.start(t);o.stop(t+.16)};

A.pad=function(f){const c=this.ctx,o=c.createOscillator(),lp=c.createBiquadFilter(),g=c.createGain(),t=c.currentTime;o.type="sawtooth";o.frequency.value=f;lp.type="lowpass";lp.frequency.value=600;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.03,t+1);g.gain.linearRampToValueAtTime(0,t+3.1);o.connect(lp);lp.connect(g);g.connect(this.master);o.start(t);o.stop(t+3.2)};
