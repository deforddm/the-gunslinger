<style>
/* Layout: one column like a paperback page — a painted plate above, the text below, a thin belt of gear at the foot. Road scenes on bone paper; memories on umber. */
:root{
  --bone:#E8DCC4; --dust:#C9A96E; --mustard:#B8912F; --sienna:#8A4B22; --sunline:#F2622A;
  --peach:#F4B58A; --lavender:#A997B8; --smoke:#4A4552; --umber:#1E1712; --acid:#9ACD32;
  --sulphur:#C9C13A; --moss:#3E6B3A; --blood:#7A1E1E; --ink:#2B2019; --inkSoft:#6B5A48;
  --paper:var(--bone); --text:var(--ink); --muted:var(--inkSoft); --rule:#CDBB98;
  --f-display:"IM Fell English SC","IM Fell English",Georgia,"Times New Roman",serif;
  --f-italic:"IM Fell English",Georgia,serif;
  --f-body:"Spectral",Georgia,"Times New Roman",serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--umber);color:var(--bone);font-family:var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
#app{height:100%;max-width:720px;margin:0 auto;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:var(--paper);box-shadow:0 0 60px #000a}
body.memory #app{--paper:#2A2019;--text:#E8DCC4;--muted:#A89478;--rule:#4A3A2C}
#art{position:relative;aspect-ratio:5/3;max-height:40vh;width:100%;overflow:hidden;background:var(--umber)}
#art svg,#art canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#art .fade{transition:opacity .9s ease}
#memTag{position:absolute;left:12px;top:10px;font-family:var(--f-display);font-size:12px;letter-spacing:.18em;color:var(--bone);opacity:0;transition:opacity .6s;text-shadow:0 1px 3px #000}
body.memory #memTag{opacity:.85}
#text{overflow-y:auto;padding-block:18px 28px;padding-inline:20px;background:var(--paper);color:var(--text);transition:background .8s,color .8s;cursor:pointer;min-width:0}
#text .inner{max-width:34em;margin:0 auto;display:flex;flex-direction:column;gap:.85em}
.hdr{font-family:var(--f-display);font-size:13px;letter-spacing:.16em;color:var(--muted);display:flex;justify-content:space-between;gap:12px;align-items:baseline;border-bottom:1px solid var(--rule);padding-bottom:8px;margin-bottom:4px}
.hdr .t{font-size:18px;letter-spacing:.06em;color:var(--text);text-wrap:balance}
p.l{margin:0;font-size:17px;line-height:1.62;animation:rise .7s ease both}
p.l.said{padding-left:1.1em;text-indent:-1.1em}
p.chosen{margin:0;font-family:var(--f-italic);font-style:italic;color:var(--muted);font-size:15px;animation:rise .5s ease both}
p.chosen::before{content:"— "}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.choices button{text-align:left;background:transparent;border:1px solid var(--rule);border-left:3px solid var(--sienna);padding:11px 14px;font-family:var(--f-italic);font-size:16.5px;color:var(--text);cursor:pointer;border-radius:2px}
.choices button:hover,.choices button:focus-visible{background:#8A4B2214;outline:none;border-color:var(--sienna)}
.more{align-self:center;font-family:var(--f-display);font-size:12px;letter-spacing:.3em;color:var(--muted);opacity:.7;animation:breathe 2.4s ease-in-out infinite;user-select:none;padding:6px}
@keyframes breathe{50%{opacity:.25}}
#belt{display:flex;align-items:center;gap:14px;padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px));background:var(--umber);color:var(--bone);border-top:1px solid #3a2c20}
#water{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:12px;letter-spacing:.14em;color:var(--dust)}
#water svg{width:22px;height:26px}
#water .bar{width:74px;height:5px;background:#3a2c20;border-radius:3px;overflow:hidden}
#water .bar i{display:block;height:100%;background:var(--dust);transition:width .8s}
#belt .sp{flex:1}
.ib{background:none;border:1px solid #3a2c20;border-radius:3px;color:var(--bone);padding:6px 10px;cursor:pointer;font-family:var(--f-display);font-size:12px;letter-spacing:.14em}
.ib:focus-visible{outline:2px solid var(--dust)}
#sigil{border-color:var(--lavender);color:var(--lavender)}
#sigil[hidden]{display:none!important}
#sigil::before{content:"◈ ";}
/* overlays */
.ov{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#120d0aee;padding:20px 16px}
.card{width:100%;max-width:520px;max-height:100%;overflow:auto;background:var(--umber);border:1px solid #4a3a2c;padding:24px 22px;color:var(--bone)}
.card h2{font-family:var(--f-display);font-weight:400;font-size:22px;letter-spacing:.08em;margin:0 0 14px;text-wrap:balance}
.card p{line-height:1.6;margin:0 0 12px}
.card .row{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.btn{background:transparent;border:1px solid var(--dust);color:var(--bone);padding:10px 16px;font-family:var(--f-display);letter-spacing:.14em;font-size:14px;cursor:pointer;border-radius:2px}
.btn:hover,.btn:focus-visible{background:#C9A96E22;outline:none}
.btn[disabled]{opacity:.35;cursor:default}
.echo{font-family:var(--f-italic);font-style:italic;font-size:18px;line-height:1.55;color:var(--bone)}
.echo-h{font-family:var(--f-display);letter-spacing:.2em;font-size:12px;color:var(--lavender);margin-bottom:10px}
textarea{width:100%;min-height:80px;background:#120d0a;color:var(--bone);border:1px solid #4a3a2c;font-family:ui-monospace,monospace;font-size:12px;padding:8px}
.chap{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #3a2c20;padding:10px 0}
.chap span{font-family:var(--f-display);letter-spacing:.06em}
.chap small{color:var(--dust);font-size:12px}
/* title */
#title{position:fixed;inset:0;z-index:15;display:flex;flex-direction:column;background:var(--umber)}
#title .plate{position:relative;flex:1 1 55%;min-height:200px}
#title .plate svg{position:absolute;inset:0;width:100%;height:100%}
#title .words{padding:18px 20px calc(22px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:10px}
#title h1{font-family:var(--f-display);font-weight:400;font-size:clamp(38px,11vw,64px);letter-spacing:.06em;margin:0;line-height:1;color:var(--bone)}
#title .sub{font-family:var(--f-display);letter-spacing:.22em;font-size:12px;color:var(--dust)}
#title blockquote{margin:6px 0 0;font-family:var(--f-italic);font-style:italic;font-size:19px;line-height:1.45;color:var(--bone);text-wrap:balance}
#title cite{display:block;font-style:normal;font-family:var(--f-body);font-size:12px;color:#A89478;margin-top:4px}
#title .adult{font-size:13px;color:#A89478}
#title .menu{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
#title label{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--bone);margin-top:4px;cursor:pointer}
#title input[type=checkbox]{accent-color:var(--lavender);width:18px;height:18px}
/* draw */
#draw{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#120d0ad0;touch-action:none;user-select:none;-webkit-user-select:none}
#draw .ring{position:relative;width:180px;height:180px}
#draw .ring svg{width:100%;height:100%}
#draw .cap{font-family:var(--f-display);letter-spacing:.24em;font-size:13px;color:var(--dust);text-align:center;padding:0 16px}
#tull{position:fixed;inset:0;z-index:30;background:#000;display:flex;flex-direction:column;touch-action:none;user-select:none;-webkit-user-select:none}
#tull canvas{flex:1;width:100%;min-height:0;display:block}
#tull .hud{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:0;right:0;display:flex;justify-content:center;gap:18px;font-family:var(--f-display);letter-spacing:.14em;font-size:14px;color:var(--bone);font-variant-numeric:tabular-nums;text-shadow:0 1px 4px #000}
#tull .hud b{font-weight:400;color:var(--sunline);min-width:1.4em;display:inline-block;text-align:right}
#tull .line{position:absolute;left:16px;right:16px;bottom:calc(92px + env(safe-area-inset-bottom,0px));text-align:center;font-family:var(--f-italic);font-style:italic;font-size:18px;line-height:1.45;color:var(--bone);text-shadow:0 1px 6px #000;max-width:30em;margin:0 auto;min-height:3em}
#tull .hint{position:absolute;bottom:calc(30px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-family:var(--f-display);letter-spacing:.3em;font-size:12px;color:var(--dust);opacity:.8}

:root{--voice:#6A2E18}
body.memory #app{--voice:#D9A57A}
p.l.jake{font-style:italic;padding-left:.9em;border-left:2px solid var(--rule)}
p.l.voice{font-family:var(--f-italic);font-style:italic;color:var(--voice);font-size:18px}
p.l.parched{word-spacing:.18em;opacity:.78}
.game{position:fixed;inset:0;z-index:30;background:#000;color:var(--bone);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;touch-action:none;user-select:none;-webkit-user-select:none;padding:16px}
.game .cap{font-family:var(--f-display);letter-spacing:.24em;font-size:13px;color:var(--dust);text-align:center;transition:opacity .8s;min-height:1.2em}
#drop .hands{width:min(86vw,440px);height:auto}
#drop .meter{width:200px;height:4px;background:#3a2c20;border-radius:2px;overflow:hidden}
#drop .meter i{display:block;height:100%;width:100%;background:var(--bone)}
#drop .mib{font-family:var(--f-italic);font-style:italic;font-size:18px;line-height:1.5;max-width:28em;text-align:center;min-height:3em}
blockquote.last{font-family:var(--f-italic);font-style:italic;font-size:clamp(26px,7vw,40px);line-height:1.3;text-align:center;max-width:15em;margin:0;text-wrap:balance}
blockquote.last cite{display:block;font-style:normal;font-family:var(--f-body);font-size:13px;color:#A89478;margin-top:14px}
#tarot{background:radial-gradient(ellipse at 50% 60%,#1c2a44 0%,#0a0810 70%)}
.spread{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:520px}
.card7{position:relative;width:74px;height:114px;background:none;border:0;padding:0;cursor:pointer;transition:transform .9s ease;border-radius:4px}
.card7:focus-visible{outline:2px solid var(--dust);outline-offset:3px}
.card7 .back,.card7 .face{position:absolute;inset:0;transition:opacity .5s}
.card7 .back{background:repeating-linear-gradient(45deg,#3A2718 0 6px,#2A1C12 6px 12px);border:1.5px solid #8A6A35;border-radius:4px}
.card7 .face{opacity:0}.card7 .face svg{width:100%;height:100%;display:block}
.card7.up .face{opacity:1}.card7.up .back{opacity:0}
.card7[disabled]:not(.up){opacity:.5;cursor:default}
.card7.burn .face{animation:burn 2.2s forwards}
@keyframes burn{0%{filter:none}35%{filter:sepia(1) saturate(5) hue-rotate(-25deg) brightness(1.3)}100%{filter:brightness(.1);opacity:0;transform:translateY(-24px) scale(.7)}}
.reading{font-family:var(--f-italic);font-style:italic;font-size:18px;line-height:1.5;max-width:30em;text-align:center;min-height:4.5em;margin:0}
#vision canvas{position:absolute;inset:0;width:100%;height:100%}
#vision .vq{position:relative;z-index:2;max-width:28em;text-align:center;font-family:var(--f-italic);font-style:italic;font-size:19px;line-height:1.5}
#vision .vq .row{display:flex;gap:10px;justify-content:center;margin-top:10px}
#vision .cap{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom,0px));left:0;right:0}
#ending{background:var(--umber)}
#ending .endwrap{max-width:520px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
#ending .sub{font-family:var(--f-display);letter-spacing:.22em;font-size:12px;color:var(--dust)}
#ending h2{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,9vw,54px);margin:0}
#ending p{line-height:1.6;margin:0;color:#CDBB98}
@media (prefers-reduced-motion:reduce){p.l,p.chosen{animation:none}.more{animation:none}.card7.burn .face{animation:none;opacity:0}#art .fade{transition:none}}
</style>
</head>

    <blockquote>The man in black fled across the desert, and the gunslinger followed.<cite>Stephen King, <i>The Gunslinger</i> (1982)</cite></blockquote>
    <div class="adult">For adult readers. A faithful walkthrough of a violent book.</div>

 "CR-1":"A long way from here, another man will ask whether this was real. Beyond the desert, the answer changes every time.",

 "CR-3":"The preacher calls it the Beast. Others will name it by a red colour and a red eye, and the eye will outlast the rest of it."
};
const NODS=["A red balloon tied to a fencepost, bobbing in a wind that isn’t blowing.","A torn newspaper in the sand. The headline is about a flu. Someone called it Captain Trips.","A boy named Danny, a hotel in the snow, a room with a number on the door.","A low man in a yellow coat, asking after a lost dog that was never lost."];

const S=[
{id:"1.1",title:"Parsecs of Hardpan",kind:"road",art:"desert",amb:"wind",items:[
"The desert went on in every direction the eye could stand to look, white hardpan and alkali and the low blue humps of devil-grass, and it went on past that.",
"The gunslinger walked. The mule walked behind him on the end of a rope and did not want to.",
{w:-4},
"Ahead of him the trail of the man in black ran south and east, a line of prints in the crust so faint the wind had nearly finished them. The gunslinger read them the way a man reads a letter he already knows by heart.",
"The sun stood overhead like a coin nailed to a door. Nothing cast a shadow but him, and the mule, and the guns.",

{w:-4},
"Two waterbags hung from the mule’s pack. One was nearly flat.",
{c:"drink",opts:[
 ["Drink now",["He drank three swallows and made himself stop at three. The water was warm and tasted of the bag. It was the best thing in the world and he hated it for that."],{w:-10}],
 ["Ration it",["He wet his mouth and swallowed nothing. Later. There would be a later, or there would not, and either way the water would keep."],{}]
]},
{w:-5},
"Toward evening he came on one of the man in black’s fires.",
"It was a small fire, laid neat, the devil-grass burned down to a pale ash that held the shape of the stalks until he breathed on it. The man in black always left his fires like this. As if for inspection. As if he knew who would come by.",
{c:"ash",opts:[
 ["Kick it apart",["He kicked the ash to nothing and stood a while in the drift of it. It did no good. It never did."]],
 ["Leave it as it lies",["He left it as it lay. There was a kind of courtesy between them, and he did not know which of them had begun it."]]
]},
"He slept beside it with his back to the wind. In the night the mule groaned like an old man."
]},
{id:"1.2",title:"The Hut at the Edge",kind:"road",art:"hut",amb:"wind",items:[
{w:-6},
"The next day the land began to fail as desert and fail as anything else. The hardpan broke into sand and the sand rose in long dunes the colour of old teeth, and between two of them, where no one had any business living, someone was living.",
"A hut of sod blocks roofed with brush. A patch of corn standing yellow and stubborn in the sand. A well with a sweep and a bucket. Smoke.",

{c:"door",opts:[
 ["Rest a hand on the gun",["The gunslinger’s hand went to the gun and rested there. The young man looked at the hand and then at his face and nodded, as if that were fair."]],
 ["Keep the hands in sight",["The gunslinger kept his hands where the young man could see them. It cost him something. He paid it."]]
]},
"— Rain on you, the young man said. It was a farmer’s blessing out of a wetter country, and the gunslinger had not heard it in years.",
"— And on you.",
"— I’m Brown. Got water. Got beans. That mule of yours won’t see morning.",

"The raven opened its beak. — Go to hell, it said, very clearly, and settled its feathers.",
{c:"raven",opts:[

 ["Look past it",["The gunslinger looked past the bird at the well. The bird did not like to be looked past. It said something else, worse."]]

]},
{id:"1.3",title:"Beans and Grace",kind:"road",art:"interior",amb:"fire",sigil:"CR-1",items:[
"The mule lay down in the dooryard before the light went, folded its legs under it like a dog, and died without complaint. It had complained across the whole of the desert and at the end it had nothing to say.",

{w:100,set:true},

 ["Keep silent",["He said nothing. If Brown was a thing set down in his road, then the thing had set out beans, and the beans were in him now, and there was no undoing that."]]

]},
{id:"1.4",title:"Brown Asks",kind:"road",art:"embers",amb:"fire",items:[
"Later the lamp burned low and neither of them moved to fix it. Wind worked at the sod. Somewhere out on the dunes a thing cried once and stopped.",

"Brown waited. The raven waited. The gunslinger remembered."
]},
{id:"1.5",title:"The Piano Through the Wall",kind:"memory",art:"street",amb:"piano",items:[
"Tull at sundown. One street, and the street a gut of red dust between two rows of false fronts that leaned together like drunks. Past it, a church. Past that, nothing.",

"From the saloon came a piano. Someone was playing “Hey Jude” on it, badly, a song out of some other world washed up here like wreckage off a sea. He knew the tune without knowing how he knew it.",
"He tied the mule and went in. The piano stopped. It started again. The room was full and silent, men at the tables with their hats on, and every face turned to him and then turned carefully away.",
"The piano player was a thin man with a bad mouth. The woman behind the bar had a scar on her forehead, white and old, and a pale used face, and she was not afraid of him, or pretended well.",
{c:"sit",opts:[
 ["The bar",["He went to the bar and put his back to the room. It was a thing he did sometimes, to see what a room would do with his back."]],
 ["The wall",["He took a table against the wall where he could see the whole room and the whole room could see him seeing it."]],
 ["The door",["He stood near the door. A man by the door can be anywhere in a moment. A man by the door is also always half gone, and the room knew it."]]
]},
"He laid a gold piece on the wood. The woman looked at it a long time.",
"— Beer, he said. And meat, if there’s meat.",
"— There’s burgers.",
"— Then burgers.",
"While he ate, a man came in off the street. He came slowly and his feet did not seem to know the floor. His teeth were green to the gums and his eyes were the eyes of a man looking at something far off and liking it. A weed-eater. The whole room drew in from him.",
"He stopped by the gunslinger’s table and bent down, and the smell of him was sweet and rotten, and he spoke. It was the High Speech. The gunslinger had not heard it from any mouth but his own in twelve years. It came out of that ruined mouth whole and clean and courtly, a greeting such as one lord gives another at a gate.",
{c:"nort",opts:[
 ["Answer in the High Speech",["The gunslinger answered in kind. His own voice sounded strange to him, too careful, like a man crossing a floor he has been told is rotten. The weed-eater smiled with his green teeth and went away to a corner and lay down."]],
 ["Turn away",["The gunslinger turned his face to his plate. After a while the weed-eater said the greeting again, more softly, the way a man repeats a thing to a child, and then went away to a corner and lay down."]]
]},
"The piano took up again.",
"— That’s Nort, the woman said, taking his plate. Pay him no mind. He’s dead."
]},
{id:"1.6",title:"Allie’s Price",kind:"memory",art:"lamp",amb:"piano",sigil:"CR-2",items:[
"Her name was Allie. She told him that later, upstairs, in a room with a lamp and a curtain and a bed that sagged toward the middle as if something heavy had lain there a long time.",
"— You want to know about the man in black, she said. I can see it on you. I’ll tell you. It isn’t free.",
{c:"price",opts:[
 ["Offer gold",["He put gold on the table. She looked at it and then at him and did not pick it up.","— That’s not the price, she said.","He understood her. He put the gold away."]],
 ["Name her price for her",["— I know what the price is, he said.","She looked at him a long moment, and then she turned the lamp down."]]
]},
"Afterward she lay with her back to him and told it to the wall.",
"Nort had eaten the grass until it ate him. He died in the street in high summer with the flies on him. They waked him in the saloon, such as a wake is in Tull, which is drinking and cards and the dead man on a table by the stove.",
"— And he came, she said. Out of the desert. A wind came up the street ahead of him and blew the lamps down, and he came in with his hood up, laughing. Like he’d heard a joke out there and carried it all this way to tell us.",
"He bent over Nort. He did things. She would not say what things. When he straightened, Nort sat up on the table and asked for a drink.",
"— Then he went on. South and east. He didn’t even stay the night.",
"— And Nort?",
"— Nort’s been down there. Wherever it is. He’s been, and he came back, and he walks around and eats his grass and nobody asks him. Nobody asks him what it’s like.",
"She was quiet a while.",
"— I think about asking him, she said. Nights. I think about it all the time.",
{c:"ask",opts:[
 ["Ask if anyone has",["— Has anyone asked him? he said.","— No.","— Don’t, he said.","She laughed without any sound. — You think I don’t know that?"]],
 ["Leave it unasked",["He did not ask her what she thought Nort would say. He had an idea it was the only thing in Tull worth knowing, and that knowing it would be the end of whoever knew."]]
]}
]},
{id:"1.7",title:"Four Days",kind:"memory",art:"barn",amb:"wind",items:[
"He stayed four days. He could not afterward have said why. His body had been in the desert a long time and was glad of a bed, and his mind was glad of nothing, and between them they let him stay.",
"In Allie’s room he found a magazine, very old, its pages gone the colour of tea. There were pictures in it of people in bright clothes standing beside machines. Most of the words he could not read.",
{c:"mag",opts:[
 ["Turn the pages",["He turned the pages slowly, one each night, the way a man spends coins he knows are the last. The people in the pictures smiled at him out of a world that had not yet moved on. He did not smile back."]],
 ["Put it face down",["He looked at it once and put it face down. It was a thing from before, and the before was gone, and looking at it only made the room smaller."]]
]},
"He went to the livery to see about the mule. The hostler was named Kennerly, a man with a slack wet mouth and too many daughters, who watched the gunslinger the way a dog watches a man with a stick.",
"— What’s past the desert? the gunslinger asked him.",
"Kennerly scratched. — Mountains, I hear. Past them a sea, I hear. Green water. I hear there’s things in the mountains you don’t want to meet. Never been. Nobody from here has been.",
"— Somebody came from out there.",
"Kennerly’s eyes moved. — The preacher woman, he said. You ought to hear her sometime. Sunday.",
"Behind him in the dark of the barn a girl stood watching with a length of stovewood in her hands. His daughter Soobie. She was the size of a man and had not blinked since the gunslinger walked in.",
{c:"kenn",opts:[
 ["Believe him",["The gunslinger believed him. Men like Kennerly lie about small things and tell the truth about large ones, out of laziness."]],
 ["Believe none of it",["The gunslinger believed none of it except the word about the preacher, and he believed that because Kennerly had not wanted to say it."]]
]}
]},
{id:"1.8",title:"Wrists",kind:"memory",art:"knife",amb:"none",items:[
"On the third night the piano player came up the stairs.",
"The gunslinger heard him on the fourth step, which spoke. He heard him stop on the landing and breathe. Allie was asleep. Then Allie was not.",
"The door came open and the piano player came through it with a kitchen knife held low, like a man who has seen it done and never done it. He was crying. He said Allie’s name and something about years.",
"The gunslinger’s hands moved.",
{draw:"wrists"},
"He did not use the guns. There was no need of them. He took the man’s wrists, one and then the other, and bent them in a direction wrists are not made to go, and there was a sound like green sticks.",
"The piano player sat down on the floor with his hands in his lap and looked at them.",
"— Sheb, Allie said. Oh, Sheb. She did not say it with love. She said it the way you say the name of weather.",
"Sheb went down the stairs on his knees and elbows. The next night someone else played the piano, worse."
]},
{id:"1.9",title:"The Sermon",kind:"memory",art:"church",amb:"none",sigil:"CR-3",items:[
"Sunday. The church stood at the end of the street with its back to the desert. It was built of raw planks that had shrunk in the sun until the daylight came through between them in bars, so that the people inside sat in a cage of light.",
"He came late. The benches were full. The whole town was there, the whole town that would be dead in two days, sitting close with their hats in their laps.",
{c:"pew",opts:[
 ["Sit at the back",["He sat on the end of the last bench. The man beside him moved away the width of a hand, and then the width of another."]],
 ["Stand in the door",["He stood in the door with the desert at his back. It was a place to stand if you wanted to leave, and a place to stand if you wanted everyone to know that you could."]]
]},
"The preacher was a woman. She was huge. She filled the pulpit and overflowed it, and when she moved, the pulpit moved with her. Her voice was low and sweet and went into a person like water into sand.",
"She preached the Interloper. She said he walked among them in the shape of a man. She named him the Antichrist and she named the Beast his master, and she said the Last Times had come to the desert and to Tull. She said the Interloper would come with guns. The gunslinger felt the heads on the benches not turn.",
"Halfway through he had the feeling he had heard all of it before. Not a sermon like it: this sermon, this woman, this light between these boards. As if he had dreamed it long ago and forgotten, and was being made to remember it a word at a time.",
{c:"stay",opts:[
 ["Stay to the end",["He stayed. It would have been a kind of answer to leave, and he did not want to give her one."]],
 ["Go",["He rose to go. At the door he found he had not gone. He was standing with his hand on the frame, listening, and he stood like that until the end."]]
]},
"When it was over they filed out past him and none of them looked at him, and the preacher came last and looked at nothing else.",
"— Sylvia Pittston, Allie told him that night. Came out of the desert three, four years back. Same way he went. She has a shack behind the church. Don’t go there."
]},
{id:"1.10",title:"The Shack",kind:"memory",art:"slit",amb:"none",items:[
"He went there.",
"It was full dark. The shack had one window and the window had a board across it with a crack in the board, and through the crack came one line of yellow light that lay on the ground like a thing dropped.",
"She opened before he knocked. She had been waiting.",
"— He said you would come, she said, and let him in.",
"Inside it smelled of tallow and of her. She sat on the bed, which was a great deal of bed, and folded her hands over her belly, and smiled.",
"— He lay with me, she said. The man of God. He came down out of the desert and lay with me and I carry his child. An angel. Do you understand? I carry an angel for him.",
"The gunslinger looked at her belly and at her hands on it. He thought of Nort sitting up on the table. He thought of what the man in black left behind him, always, laid neat, for inspection.",
{c:"shack",opts:[
 ["“It’s no angel.”",["— It’s no angel, he said.","She laughed at him. She was still laughing when he drew."]],
 ["“Where did he go?”",["— Where did he go? he said.","— To the mountains, she said. Past them. He waits on the far side to make his strength.","She told him freely, smiling, the way you tell a thing that can do you no harm. Then he drew."]],
 ["“This won’t be long.”",["— This won’t be long, he said.","She understood him then. She stopped smiling. It did not help her."]]
]},
"What he did then he did with the barrel of his gun, and he did it quickly, and the thing inside her that was not a child died of it. She screamed once. It was not her scream. It came up out of her in a voice like a bird’s and went out through the crack in the board into the night.",
{unless:["shack",1],t:"When she could speak again she told him where the man in black had gone: over the mountains, and waiting on the far side, gathering himself. She told him with hate. It was the first true thing he had heard in Tull."},
"He went out. Behind him the line of yellow light lay on the ground where it had lain before, and nothing about it had changed."
]},
{id:"1.11",title:"Storm",kind:"memory",art:"storm",amb:"storm",items:[
"By morning the wind had turned. It came off the desert brown, carrying the desert with it, and the sun went out behind it like a lamp behind a sack.",
"He knew what the wind meant. He knew what Sylvia Pittston had done with her night, going door to door with her great soft voice. He went to the livery for the mule.",
"Kennerly was there and not glad to be. He talked about the weather and the price of feed and his daughters, and while he talked he stood between the gunslinger and the mule, and his eyes went to the barn door, and to the barn door, and to the barn door.",
"The girl Soobie came out of the stall behind him with the stovewood. The gunslinger stepped out of the way of it. It went past his head into the post, and the post shook, and dust came down.",
{c:"mule",opts:[
 ["Take the mule by the bridle",["He took the mule by the bridle and led it out past them. Neither of them tried again. They had done what they were told, and it had been enough to hold him, and holding him was all anyone had asked."]],
 ["Cut it loose",["He drew his knife to cut the tether and let the mule run. Then he did not. He would need it in the desert, if there was a desert after this. He led it out past them."]]
]},
"When he came into the street the street was full."
]},
{id:"1.12",title:"The Street",kind:"memory",art:"canted",amb:"storm",items:[
"They came out of the brown air all at once, the whole town, men and women and the children behind them, with what they had. Hoes. Scythes. Boards with nails through them. Bricks. A butcher’s cleaver. They came silent and then they were not silent. They were shouting a word. The word was Satan.",
"In front of them, held before him like a door, the piano player had Allie. His ruined hands were wrapped in rags and one of them was knotted in her hair, and he walked her ahead of him up the street.",
"— Please, she said. She was looking at the gunslinger. Please don’t. Please don’t shoot me. Please.",
"His hands did what they had been made to do.",
{tull:true},
"The wind dropped. The dust began to settle on them, on all of them, evenly, as if the desert had been waiting for this and had come to take back what it had lent."
]},
{id:"1.13",title:"The Dead Town",kind:"memory",art:"deadtown",amb:"wind",items:[
"He counted them. It took a long while. Thirty-nine men. Fourteen women. Five children. He counted the children twice.",
"Then he went into the saloon, because there was nowhere else to go.",
"Nort was there. Someone had hung him on the wall behind the bar, through the hands, the way a man nails a coyote to a fencepost for a lesson to the others. His green mouth hung open. He was dead again, and this time it had taken.",
{c:"nortdown",opts:[
 ["Cut him down",["He cut him down and laid him on the floor and put a tablecloth over him. It was the only burial anyone in Tull would get."]],
 ["Leave him hanging",["He looked at him a long time. Then he cut him down after all, because he found he could not eat with Nort watching, and he laid him on the floor under a tablecloth."]]
]},
"He ate what was in the kitchen. He drank what was behind the bar. He tasted none of it.",
{c:"bed",opts:[
 ["Sleep in her bed",["He went up and lay down in Allie’s bed, in the hollow in the middle of it, and slept at once."]],
 ["Sleep on the floor",["He lay down on the floor of her room with his back to the door. In the night he got up without waking and lay down in the bed. In the morning he did not remember doing it."]]
]},
"At dawn he walked the mule down the street between them and out into the desert. He did not look back, and the town did not look after him. It had nothing left to look with."
]},
{id:"1.14",title:"He’s Close",kind:"road",art:"dawn",amb:"wind",items:[
"The lamp had gone out. Brown sat in the dark with his hands between his knees. The raven slept on the roof beam with its head under its wing.",
"— Well, Brown said after a long time.",
"— Well.",
"— You feel better? Telling it?",
"The gunslinger thought about it honestly. — No, he said.",
"Brown nodded as though that were the answer he had expected. — He was through here, he said. Your man. Not so long ago. He’s closer than you think.",
"In the morning Brown walked him to the edge of the corn.",
"— I’ll eat your mule, he said. If that’s all right.",
"— It’s all right.",
{c:"part",opts:[
 ["Thank him",["— Thank you for the water, the gunslinger said. It was more than he had said to anyone in a year. Brown looked surprised, and then embarrassed, and then he raised his hand."]],
 ["Look back from the dune",["He did not thank him. But at the top of the first dune he turned and looked back, and Brown was still standing at the edge of the corn with the raven on his shoulder, and Brown raised his hand, and the gunslinger raised his."]]
]},
{w:-6},
"Then the dune was between them, and there was only the desert again, and the line of prints going south and east."
]},
{id:"1.15",title:"Not of Tull",kind:"road",art:"dream",amb:"wind",items:[
{w:-6},
"That night he made his fire of devil-grass, small, and lay down beside it with the guns under his hands.",
"He thought he would dream of Tull. Of her face in front of the piano player’s. Of the count.",
"He dreamed of Cort.",
"He dreamed of the yard behind the great hall in Gilead, and the sun on the stones, and the old man with his staff and his broken nose, standing over a boy who had fallen and was not yet sure he wanted to get up.",
"— Up, said Cort. Have you forgotten the face of your father? Up.",
"In the dream the boy got up.",
{end:1}
]},
/* ===== CHAPTER TWO — THE WAY STATION ===== */
{id:"2.1",title:"Sixteen Days",kind:"road",art:"sixteen",amb:"wind",items:[
"Sixteen days out of Brown’s, the gunslinger stopped counting days.",
{w:-10},
"The devil-grass had given out. There were no more fires to find, his or anyone’s. He lay under his blanket through the worst of the day with the blanket over his face and the sun coming through it red.",
{c:"walk",opts:[
 ["Walk by night",["He walked by night, by Polaris, which did not move, and the sand was cold through his boots, and in the dark he could not see how far there was still to go. That was a mercy of a kind."]],
 ["Walk by day",["He walked by day because the prints were easier to read by day. The sun stood on his hat like a hand pressing down. By noon he was reading prints that were not there."]]
]},
{w:-12},
"The waterbags went slack. Then one went flat, and he rolled it and tied it and carried it anyway, because it had been water once.",
{c:"last",opts:[
 ["Drink the last",["He drank the last of it at dusk, all at once, and lay back and felt it go into him like rain into a crack in the ground, and be gone."],{w:-22}],
 ["Save it",["He kept it. A mouthful at dawn, a mouthful at dusk. The water moved in the bag with a small sound, like someone talking in the next room."],{w:-9}]
]},
{w:-8},
"A rhyme had come into his head, a song out of a world that wasn’t his, and it would not go. Down the dune and up the dune, and the bone-white moon, and soon, soon. He said it under his breath until it meant nothing, and then he said it some more.",
{low:"The prints ran together. Twice he found he had been following his own."},
{low:"He talked to the mule for an hour before he remembered Brown was eating the mule."},
"On the sixteenth day, or the twentieth, he fell down and did not get up for a while. When he did get up he saw buildings.",
"They swam in the heat. He watched them a long time, waiting for them to go away the way the others had. They did not go away."
]},
{id:"2.2",title:"The Figure",kind:"road",art:"station",amb:"wind",items:[
"A way station. A long low roof of weathered boards gone silver, a stable with half its wall fallen in, a trough, a fence. The coaches had stopped coming here before anyone now living was born.",
"Someone was standing in the shade of the stable.",
"The gunslinger’s heart began to pound, slow and hard. The figure was dark against the dark of the doorway, and small with distance, and still. He had followed it across the whole of the desert.",
{draw:"held"},
"He came on with the gun out. The figure did not move. Then it moved, and stepped out into the light, and it was a boy.",
"A boy with dark hair and a sunburned face, in clothes that were wrong for this place or any place the gunslinger knew. He stood with his hands at his sides and watched the gun come and did not run.",
"The gunslinger put the gun away. Then he fell down."
]},
{id:"2.3",title:"The Pump",kind:"road",art:"pump",amb:"pump",sigil:"CR-4",items:[
"He woke in the shade with water on his face. The boy knelt over him with a tin dipper, and the water was cold. It was the coldest thing he had felt in a month.",
"— There’s a pump, the boy said. In the back. It works. I don’t know how it works, but it does.",
"The gunslinger got up and went to see it. It stood in the back room of the station, a steel thing out of place among the boards, humming to itself. Something under the floor fed it. An atomic slug, he thought, left by the Old Ones, still burning down there in the dark after all this time, lifting water for no one.",
{c:"first",opts:[
 ["Drink first",["He put his mouth under the spout and drank until he choked, and then drank again. When he straightened the boy was watching with his hands in his pockets, waiting his turn, as if there were turns."],{khef:-1}],
 ["Let the boy drink first",["He held the dipper out to the boy. The boy looked at it and at him, and then took it and drank, not much, politely, and gave it back. It was a small thing. The gunslinger did not know why he had done it."],{khef:1}]
]},
{w:100,set:true},
{c:"name",opts:[
 ["Ask his name",["— What’s your name? he said.","— Jake. The boy said it the way a boy says his name to a teacher."]],
 ["Wait for it",["He said nothing, and after a while the boy said: I’m Jake. As if silence were a question, and he had been raised to answer questions."]]
]},
"— There was a man, Jake said. Before you. A man in black. He went by in the night. I saw him from in there. He didn’t drink. He didn’t stop. I hid till he was gone.",
"— Did he see you?",
"Jake looked at the floor. — I don’t know. I think so. I think he knew I was there."
]},
{id:"2.4",title:"The Bullet on the Knuckles",kind:"road",art:"knuckles",amb:"none",items:[
"— How did you come here? the gunslinger asked.",
"— I don’t know.",
"— Do you remember?",
"The boy’s face closed. — I don’t want to.",
"The gunslinger took a cartridge from his belt and set it on the back of his hand and let it walk: over one knuckle and the next and the next, and under, and back. He had learned it from Cort, who had learned it from someone who was dust. The boy’s eyes went to the brass and stayed there.",
"— Watch it, the gunslinger said. Only watch. That’s all you have to do.",
{c:"hyp",opts:[
 ["Let it run",["He let it run. The boy’s shoulders came down. His mouth opened a little. His eyes followed the brass over and under, over and under, and then they were not following anything."]],
 ["Almost stop",["He almost stopped. He had a feeling that he should not be doing this to a child, a feeling from a long way back, from a room with his mother in it. He did not stop. The boy’s eyes went still."]]
]},
{j:"I was going to school. I had my bookbag and my lunch. My mother was asleep, she always is when I go, and my father was already at work, he’s always already at work. The doorman said have a good day and I said you too."},
{j:"I was at the corner waiting for the light. There were a lot of people."},
{j:"Somebody pushed me."},
{j:"I felt the hand. Right in the middle of my back. And I went out in the street and there was a car, a big one, and a man in a hat inside it with his mouth open, and I heard my lunch go. The bag. I heard it break."},
{j:"There was a man on the corner. After. I could see him from where I was lying. He was dressed in black, like a priest, and he was looking at me, and he was making a face like he was sorry. But he wasn’t."},
{j:"Then I was here."},
"The gunslinger closed his hand over the cartridge. The boy blinked and was only a boy again. He did not remember what he had said, and the gunslinger did not tell him."
]},
{id:"2.5",title:"First Light",kind:"road",art:"stationnight",amb:"none",items:[
"That night the gunslinger sat up with a candle end he had found in the stable and thought about the boy.",
"The man in black had left him here. Laid neat, for inspection. The gunslinger knew it the way he knew the weight of his guns.",
"He did not need to kill the man in black. Not first. He needed him to talk. There were things the man in black knew, about the Tower and what stood between, and the gunslinger meant to have them out of him one at a time if he had to.",
"The boy was asleep in the corner under the gunslinger’s coat.",
{c:"come",opts:[
 ["Tell him he’s coming",["In the morning he said: We leave at first light. You’re coming. The boy nodded. He had not expected to be asked."],{khef:-1}],
 ["Ask him to come",["In the morning he said: I’m going on, after him. You can stay here with the pump, or you can come. The boy looked at the pump, and at the desert, and at him.","— I’ll come, he said."],{khef:1}]
]}
]},
{id:"2.6",title:"The Cellar",kind:"road",art:"cellar",amb:"drip",sigil:"CR-5",items:[
"Before they left he went down into the cellar to see what the station had to give.",
"It was a root cellar cut into the ground under the back room, cool, smelling of earth. There were shelves with a few cans gone to rust, and a sack of something that had been meal once. He took what could be taken.",
"At the back the wall had cracked. Sand came through the crack in a thin steady stream, pouring and pouring, as if the desert were leaking in by the spoonful.",
"He heard a voice.",
"It came out of the crack with the sand. It was a woman’s voice, and he knew it. It was Allie’s.",
{v:"Mind the Drawers, gunslinger. Go slowly when you pass them."},
{v:"And hear this. You have the boy with you now. As long as you keep him, your soul rides in the man in black’s pocket, and he keeps his hand on it."},
{c:"voice",opts:[
 ["Answer the voice",["— Allie? he said.","The sand poured. The voice did not answer to that name or any name. It had said what it had been left there to say."]],
 ["Say nothing",["He said nothing. You do not answer a thing that speaks out of a wall. He had known that since he was a boy."]]
]},
"When it had stopped he put his hand into the crack. The sand ran over his fingers, cool, and behind it there was something hard, and he closed his hand on it and drew it out.",
"A jawbone. Old and yellow, with some of the teeth still in it. Whatever had spoken had spoken with this, or through it, or had only been waiting in the wall beside it.",
"Cort used to say a thing about prophecy: that the living lie about it, and only the bones don’t. He put the jawbone in his pocket.",
{jaw:true},
"Up in the light, the boy asked what was down there.",
"— Nothing, the gunslinger said. Cans."
]},
{id:"2.7",title:"The Hawk and the Cook",kind:"memory",art:"yard",amb:"wind",items:[
"They walked toward the mountains, which had come up out of the haze overnight, blue and far. The boy asked where he was from. The gunslinger found that he was telling him.",
"Gilead. The yard behind the great hall, its stone flags worn hollow by boys’ feet. Cort in the middle of it with his staff: Cort who had taught the gunslinger’s father, and whose face was a map of every lesson he had ever given with his hands.",
"There was a hawk. Its name was David. Cort gave it to the boy the gunslinger had been and said: You will train him, or he will train you, and I will know which.",
"His friend Cuthbert trained a hawk too, badly, and laughed about it, and the hawk bit him, and he laughed about that.",
{c:"hawk",opts:[
 ["Tell the whole of it",["He told the boy about the hawk. How it came to the glove. How it hated him, and how he did not mind, because it was not a thing that was for liking. The boy listened with his whole face."]],
 ["Tell the short of it",["— There was a hawk, he said. I trained it. And he left the rest where it was."]]
]},
"One night he and Cuthbert went where boys should not go, down under the great hall, along the passages by the kitchens, and heard voices.",
"The cook was talking to a guard. The cook’s name was Hax. He was a big soft man with a big soft laugh who gave the boys sweets from his kitchen, and he was talking about poison.",
"There was a town called Farson. There was meat to be sent there, and the meat would have something in it. It was for the good man, Hax said, and the good man would remember who had helped him, when the good man came.",
"The boys went back up the passage without a sound. On the stairs Cuthbert was not laughing.",
{c:"father",opts:[
 ["Tell his father",["He went to his father. He stood in his father’s room with his hands at his sides and told him everything, in order, the way Cort had taught him to report. His father listened without a word. Then he said: Thank you. It was the only time he ever said it."]],
 ["Keep it",["He meant to keep it. He lay awake a whole night deciding to keep it. In the morning he went to his father and told him everything, in order, the way Cort had taught him. There had never been any keeping it."]]
]}
]},
{id:"2.8",title:"Gallows Hill",kind:"memory",art:"gallows",amb:"wind",sigil:"CR-6",items:[
"They hanged Hax on Gallows Hill on a day with a hard wind.",
"Half of Gilead came out to see it. The boys stood at the front. It was thought right that they should see what their telling had made.",
"Hax came up the steps in a white shirt. He did not look at anyone. The hangman put a black cloth over his eyes, and then the rope. There were ravens on the beam.",
"Then there was the sound, and then there was not any sound, and Hax turned a little on the rope in the wind.",
"Afterward, by the old custom, bread was broken under the gallows and scattered for the birds, and each of the boys took a splinter from the gallows beam. The gunslinger kept his a long time. He did not know what had become of it.",
{c:"bread",opts:[
 ["Share bread with Cuthbert",["Cuthbert broke a heel of the bread in two and gave him half. They ate it standing there. It was the worst bread in the world."]],
 ["Walk off alone",["He walked away from the others and stood on the hill with his back to the gallows until the ravens came down."]]
]}
]},
{id:"2.9",title:"A Speck on the Slope",kind:"road",art:"slope",amb:"wind",items:[
"When he stopped talking the sun was going down behind them and the mountains ahead had gone the colour of a bruise.",
"The boy had been quiet a long time.",
"— Did you feel bad? he said. About the cook?",
"The gunslinger thought about it. — No, he said. He meant it. It was not the answer the boy wanted, and it was still the answer.",
"Then he saw it. Far up the first long slope of the foothills, above the last of the light, a mark. A speck. Moving. Climbing.",
{c:"point",opts:[
 ["Point him out to Jake",["— There, he said. The boy looked where he pointed and saw it too, and the gunslinger watched his face and saw what went across it."],{khef:-1}],
 ["Say nothing",["He said nothing. Let the boy sleep tonight. The speck went on up the mountain and the gunslinger watched it until it was gone."],{khef:1}]
]},
"They were close now. For the first time in all the long months of it, they were close.",
{end:2}
]},

/* ===== CHAPTER THREE — THE ORACLE AND THE MOUNTAINS ===== */
{id:"3.1",title:"Green",kind:"road",art:"green",amb:"birds",items:[
"The land changed. It changed in a day, the way a face changes when someone it loves walks into the room. Grass. Real grass, green and soft, and water moving through it, and willows along the water with their long hair down.",
"The boy walked through it touching things.",
"A rabbit sat up in the grass thirty paces off.",
{c:"rabbit",opts:[
 ["Shoot it",["The gunslinger drew."]],
 ["Offer Jake the gun",["He held out the gun to the boy, butt first. The boy looked at it a long moment and shook his head. The gunslinger drew."]]
]},
{draw:"rabbit"},
"The rabbit went over in the grass. They ate it that night with the fat running down their chins.",
"In the morning a mantis came down out of the willows and landed on Jake’s head and sat there, green on black, with its hands folded.",
"Jake held very still. — Is it on me? Is it still on me?",
{c:"laugh",opts:[
 ["Laugh",["The gunslinger opened his mouth to laugh and found he did not remember how. Something came out, a sound, a bark. The boy stared at him. Then the boy laughed, at him, and the mantis flew."]],
 ["Don’t",["The gunslinger looked at the mantis on the boy’s head. Somewhere there was a laugh for this. He could not remember where he had put it."]]
]}
]},
{id:"3.2",title:"The Ring at Night",kind:"road",art:"ring",amb:"drone",items:[
"That night the gunslinger woke and the boy was gone.",
"He was up with the guns out before he knew he was awake. The blanket was thrown back. In the grass there was a path, a line where something had walked through it, going up the rise toward the stones.",
"There was a ring of standing stones on the rise. They had seen it at sunset and the boy had asked about it, and the gunslinger had said it was old, and that they would not go near it.",
{c:"go",opts:[
 ["Go in fast",["He went up the rise running."]],
 ["Go in slow",["He went up slow, the way you come on a thing that is waiting for you."]]
]},
"The boy was inside the ring. He lay on a flat stone in the middle with his arms at his sides and his eyes open, and his face was full of a terrible joy, and he was not breathing right.",
"The air inside the ring was thick. It pushed back at the gunslinger like water. Something was in there with the boy, something without a shape, and it did not want him.",
"His hand went into his pocket without his telling it to. It came out with the jawbone.",
"He held it up. He did not know what he was doing. The thing in the ring knew. It drew back from the bone with a sound like wind going out of a room, and the air let go, and the gunslinger went in and lifted the boy off the stone.",
{c:"carry",opts:[
 ["Carry him",["He carried him out in his arms. The boy weighed nothing. The boy weighed everything."]],
 ["Drag him clear",["He meant to drag him by the collar, quick, like a sack. When it came to it he picked him up and carried him in his arms."]]
]},
"Outside the ring the boy began to breathe again, and then to cry, and did not know why."
]},
{id:"3.3",title:"Tied",kind:"road",art:"tied",amb:"none",items:[
"The gunslinger sat with the boy until he slept. Then he sat a while longer, looking at the stones.",
"There was something in there. Something that had wanted the boy. Things like that knew things. They could be made to say them, if you paid.",
"He took a length of rope from the pack and tied the boy by the ankle to the trunk of a young willow.",
{c:"knot",opts:[
 ["Tie it tight",["He tied it tight. If the thing called again, the boy would not be able to answer."],{khef:-1}],
 ["Tie it loose",["He tied it loose. The boy would be able to slip it if he woke frightened. The gunslinger found he could not make it tighter."],{khef:1}]
]},
"He put the jawbone into the boy’s hands and closed the boy’s fingers over it. The boy half woke.",
"— If you feel it pulling at you, hold on to this, the gunslinger said. It doesn’t like this.",
{jaw:false},
{c:"promise",opts:[
 ["“I’ll be back by morning.”",["— I’ll be back by morning, he said. The boy nodded and slept. It was the kind of thing you tell a child. It happened to be true."]],
 ["Tell him nothing more",["He did not say where he was going. The boy did not ask. The boy held the bone."]]
]},
"Then he took the little packet from the bottom of his purse, the mescaline, and ate some of it, and waited for it to open him.",
"When the stars began to breathe, he went up the rise and into the ring."
]},
{id:"3.4",title:"The Oracle",kind:"road",art:"oracle",amb:"drone",sigil:"CR-7",items:[
"Inside the ring the grass was wet, and there was a pool he had not seen from outside, black and still, with the stars in it.",
"He knelt at the edge. His face looked up at him out of the water, and it was not his face. It was a skull.",
"Then she was there.",
"She had no shape. She had every shape. She was warm and she was all around him, and her voice came from inside his own head, the loveliest voice he had ever heard, and it was hungry.",
{v:"You came for the prophecy. They all come for the prophecy. You know the price?"},
"He knew the price. He paid it. It was not long, and it was not like anything, and afterward he lay in the wet grass and could not have said which of them had been used.",
{c:"oracle",opts:[
 ["Ask about the man in black",[]],
 ["Ask about the Tower",[]],
 ["Ask about the boy",[]]
]},
{pick:["oracle",[
 "— The man in black, he said. Where is he? What is he? She laughed. That one? He is only a door. Let me tell you about the doors.",
 "— The Tower, he said. She sighed, as if it were a name she was tired of. They all ask the Tower. Very well. The Tower is at the end of a count. Let me tell you the count.",
 "— The boy, he said. She was quiet so long he thought she had gone. Then: You ask about the boy first. How interesting. I will tell you about the boy last."
]]},
{v:"Your fate goes by threes, gunslinger. Hear the three."},
{v:"The first is young, and dark-haired, and stands at the edge of robbing and killing. A demon rides him. The demon’s name is heroin."},
{v:"The second comes to you on wheels. There is steel in her head and something softer under it, and you will not always know which of them you are speaking to."},
{v:"The third is death. Only death. Not for you."},
{v:"The boy takes you to the man in black. The man in black takes you to the three. The three take you to the Tower. That is the road."},
{k:[
 {v:"And the boy dies. You knew that before you came. You came anyway. You will go on anyway. I like you, gunslinger. You are very like me."},
 {v:"And the boy dies, if you go on. You could turn back. Take him back across the desert, find him a pump and a roof, grow old. You won’t. But I will let you hear yourself not do it."}
]},
"— Go on, the gunslinger said.",
"But she had gone, and the pool was only a pool, and the sky over the stones was going grey."
]},
{id:"3.5",title:"The Climb",kind:"road",art:"climb",amb:"wind",items:[
"They went up into the mountains. The grass gave out and the trees gave out, and then there was only rock, grey and red, and a thin cold wind, and the path going up in switchbacks.",
"On the third day the boy stopped and pointed.",
"Above them, a long way above, on a ledge where the path turned, a figure stood looking down. A hood. A dark robe moving in the wind.",
"The gunslinger drew.",
{draw:"miss"},
"The shot went up into the rock and came back down the mountain in pieces. The figure had not moved.",
"Then it laughed. The laugh came down to them thin and clear, and with it a voice, pleasant and carrying, the voice of a man calling to a friend across a street.",
{v:"Not here, gunslinger. On the other side. We’ll talk there, you and I. Only you and I."},
"The figure turned and went on up the path and was gone around the rock."
]},
{id:"3.6",title:"He Knows",kind:"road",art:"switchback",amb:"wind",items:[
"That night the boy did not sleep. The gunslinger knew it without looking.",
"— He said only you, the boy said at last.",
"— Yes.",
"— That means me. That means I don’t get there.",
"The gunslinger did not answer.",
"— He killed me before, the boy said. In the street. And now you’re going to. Aren’t you.",
{c:"truth",opts:[
 ["Tell him the truth",["— I don’t know, the gunslinger said, which was a lie. And then: Maybe. Which was the truth, or near enough that the boy heard the difference."],{khef:1}],
 ["Lie",["— No, the gunslinger said. The boy looked at him a long time in the dark. He knew. He had known since the ring."],{khef:-1}]
]},
"In the morning the boy got up and rolled his blanket and put it on his back and started up the path ahead of him. He did not ask to go back. He did not ask anything.",
{end:3}
]},

/* ===== CHAPTER FOUR — THE SLOW MUTANTS ===== */
{id:"4.1",title:"Into the Dark",kind:"road",art:"tunnel",amb:"drip",items:[
"The path went into the mountain.",
"There was a cave mouth, and inside the cave a tunnel, and in the tunnel, laid on old ties sunk in dust, a pair of rails going on into the dark. The Old Ones had made it. The Old Ones had made everything that still worked and everything that didn’t.",
"After a hundred paces there was no light at all.",
{c:"hand",opts:[
 ["Hold the boy’s hand",["He held out his hand in the dark, and after a moment the boy found it."],{khef:1}],
 ["Let him hold your belt",["— Hold on to my belt, he said, and felt the boy’s fingers hook into it at his back."],{khef:-1}]
]},
"They walked on the ties. They counted them, for something to do, and lost count, and started over.",
"— Tell me something, the boy said. Anything. So it’s not so quiet."
]},
{id:"4.2",title:"Sowing Night",kind:"memory",art:"hall",amb:"strings",sigil:"CR-8",items:[
"When he was eleven there was a dance.",
"It was Sowing Night, in the spring, and the great hall was hung with candles until it was brighter than day, and the gunslinger, who was not a gunslinger yet, who was not anything yet, crept up the back stair and lay on his belly on the gallery to watch.",
"His father sat at the high table among the other lords, in black. He did not dance. He never danced.",
"His mother danced. She was the most beautiful thing in the hall, and he had always known it. She danced with Marten.",
"Marten was the court’s sorcerer: a thin man in a dark cloak, with a smile that seemed to be listening to something no one else could hear.",
{c:"watch",opts:[
 ["Watch his mother",["He watched his mother. She was laughing at something Marten said, with her head back, the way she never laughed in her own rooms, and the candlelight lay on her throat."]],
 ["Watch Marten",["He watched Marten. Marten’s hand was at the small of his mother’s back. Once, turning, Marten looked up at the gallery, straight at the place where the boy lay, and smiled, and looked away."]]
]},
{c:"leave",opts:[
 ["Leave",["He meant to go. He did not go. He lay there until the candles guttered."]],
 ["Stay",["He stayed until the candles guttered and the dancers were gone."]]
]},
"His father had not moved from the high table the whole night. He had watched too."
]},
{id:"4.3",title:"The Handcar",kind:"road",art:"handcar",amb:"rails",items:[
"On the second day in the dark they found the handcar.",
"The gunslinger’s foot struck it. He felt it over with his hands: a flat bed on iron wheels, and in the middle a lever like a seesaw, for two, one at each end, to pump up and down.",
"— What is it? the boy said.",
"— A way to go faster.",
{c:"pump",opts:[
 ["Take the near end",["He took the near end of the lever. The boy took the far one. The gunslinger pushed and the boy was lifted almost off his feet, and laughed, and then they had the rhythm of it."]],
 ["Give Jake the near end",["He put the boy on the near end and took the far. The boy pushed with his whole weight, and the gunslinger let the lever come up slow so he could feel it, and then they had the rhythm of it."]]
]},
"The handcar ran on into the dark with a sound like a heart.",
"— Tell me about your test, the boy said. How you got to be a gunslinger.",
"The gunslinger pumped a long time before he answered."
]},
{id:"4.4",title:"Full Earth",kind:"memory",art:"door",amb:"none",items:[
"He was fourteen. It was high summer, Full Earth, the heat lying on Gilead like a hand.",
"He was going along the corridor past his mother’s rooms when the door opened and Marten came out.",
"Marten was doing up his shirt. He saw the boy and did not hurry. He finished with the shirt. Behind him, through the door, the boy saw his mother, and on his mother’s neck there was a mark.",
"Marten smiled. He said things. They were said lightly, and each of them was a hook, and they went into the boy and set. Then Marten walked away down the corridor, whistling.",
{c:"marten",opts:[
 ["“You’ll see me again.”",["— You’ll see me again, the boy said to his back.","Marten did not turn. — I’m sure I will, he said."]],
 ["Say nothing",["The boy said nothing. He stood in the corridor until the whistling was gone. His hands were shaking, and he looked at them until they stopped."]],
 ["“I know what you are.”",["— I know what you are, the boy said.","Marten turned then and looked at him with real interest. — No, he said. But you will."]]
]},
"He went to Cort.",
{c:"knock",opts:[
 ["Knock and wait",["He knocked and waited, and when Cort opened he said the words, the old ones, that a boy says when he means to be tested."]],
 ["Beat on the door",["He beat on Cort’s door with his fist until it opened. Then he said the old words, all of them, too fast."]]
]},
"Cort looked at him a long time.",
"— You are early, Cort said. Years early. If you lose, you go west. You are not a boy of Gilead again, and you do not come back.",
"— I know it.",
"— Who sent you to me today?",
"The boy did not answer. Cort nodded as if he had.",
"— What weapon?",
"— David, the boy said."
]},
{id:"4.5",title:"The Test",kind:"memory",art:"testyard",amb:"wind",sigil:"CR-9",items:[
"The yard at noon. The stones white with heat. Old men on the walls to watch.",
"Cort came out with his staff. The boy came out with the hawk on his fist, hooded.",
"Cort did not wait. Cort never waited. The staff came around low and the boy was not there, and the staff came around high and the boy was not quite there either, and then the boy pulled the hood.",
{c:"loose",opts:[
 ["Loose him high",["He threw the hawk up into the white sky, and it hung there, and turned, and came down."]],
 ["Loose him low",["He threw the hawk straight at Cort’s face from an arm’s length away."]]
]},
{draw:"hawk"},
"David went for Cort’s face. Cort made a sound the boy had never heard him make. The hawk was on him, the claws in him, and then one of Cort’s eyes was gone.",
"Then Cort took the hawk in his hand and broke its neck and threw it down.",
"The boy was on him. Afterward he did not remember much of what he did. He remembered the staff, and getting it, and what he did with it, and Cort going down and getting up and going down.",
{c:"finish",opts:[
 ["Finish it",["He raised the staff to finish it. Cort, on his knees, with his face running red, held up one hand. — Enough, he said. The boy stopped. He found he had always been going to stop."]],
 ["Stop",["He stopped with the staff raised. Cort, on his knees, looked up at him out of his one eye."]]
]},
"— The key, Cort said. Take it. It’s yours. And then, softer, so only the boy could hear: Your hawk. You used him well.",
"He held out the key to the room where the apprentice guns were kept, and smiled with his broken mouth, and fell over on his side and slept."
]},
{id:"4.6",title:"The Lower Town",kind:"memory",art:"lowertown",amb:"none",items:[
"He did not go to his father. He did not go to his mother.",
"He picked David up off the stones and buried him behind the mews. Then he went down into the lower town, where the lamps were lit early and the doors stood open, and found a woman there, and was a man for the first time in two ways in one day.",
"He never told his father that. His father would have known."
]},
{id:"4.7",title:"Poker Chip",kind:"road",art:"dark",amb:"rails",items:[
"The handcar ran on.",
"— You didn’t tell it all, the boy said.",
"— No.",
"The boy pumped a while. Then he said: I know what I am. To you.",
"— What?",
"— I’m your poker chip.",
"The gunslinger did not know what a poker chip was. The boy told him. It was a thing you put down on a table to win something bigger. It was a thing you could lose.",
{c:"chip",opts:[
 ["Tell him yes",["— Yes, the gunslinger said. It was the truest thing he had said to anyone since Tull, and he said it to a child in the dark."],{khef:-1}],
 ["Say nothing",["The gunslinger said nothing. The lever went up and down between them. The boy did not ask again."],{khef:1}]
]}
]},
{id:"4.8",title:"Slow Mutants",kind:"road",art:"mutants",amb:"rails",items:[
"They heard them first.",
"A shuffling in the dark on both sides of the rails. A wet breathing. Then a light, faint, green, and another, and another, and the gunslinger saw that the lights were faces.",
"They had been men once. They were not now. They glowed the way rotten wood glows in a swamp, and they came slowly, reaching, and there were a great many of them.",
{c:"aim",opts:[
 ["Shoot the nearest",["He shot the nearest."],{khef:-1}],
 ["Shoot the ones reaching for Jake",["He shot the ones reaching for the boy first."],{khef:1}]
]},
{draw:"mutants"},
"In the flash of each shot he saw them: a white face with no nose, a hand with too many fingers, a mouth. One had the boy by the leg. The gunslinger shot it and the boy pulled free.",
{c:"shout",opts:[
 ["“Pump!”",["— Pump! he shouted, and the boy pumped, and the handcar lurched and gathered and ran, and the hands slid off it behind them."]],
 ["“Get down!”",["— Down! he shouted, and the boy went flat on the bed, and the gunslinger worked the lever with one arm and fired with the other, and the handcar ran, and the hands slid off it behind them."]]
]},
"For a long time afterward they could hear them. Then they could not."
]},
{id:"4.9",title:"The Dead Terminal",kind:"road",art:"terminal",amb:"drip",items:[
"On the third day the tunnel opened into a great room.",
"There was light here, a little, grey, coming from somewhere far above. The rails ran through the middle of a floor of broken tile. There were signs on the walls in many alphabets, most of which the gunslinger did not know and a few of which the boy did.",
"People sat on benches along the walls. They had been sitting there a long time. They were dry and brown and light as paper, and their clothes had gone to dust on them, and some of them still held bags in their laps, as if the train were coming.",
{c:"signs",opts:[
 ["Read the signs",["The boy read one aloud for him. It said which way to go for which trains, and what not to do, and that there was no smoking. The boy laughed at that until he stopped."]],
 ["Pass them by",["He did not look at the signs. Signs were for people going somewhere they could come back from."]]
]},
"At the far edge of the room the boy stopped.",
"— I don’t want to go on, he said. I don’t want to.",
{c:"wait",opts:[
 ["Wait for him",["The gunslinger waited. He did not say anything. After a while the boy came on."],{khef:1}],
 ["Walk on",["The gunslinger walked on. After a moment he heard the boy’s feet coming after him on the tile."],{khef:-1}]
]}
]},
{id:"4.10",title:"The Trestle",kind:"road",art:"trestle",amb:"river",sigil:"CR-10",items:[
"Past the terminal the tunnel ran on, and then there was a sound of water far below, and a smell of air, and light ahead.",
"The rails went out over a chasm on a trestle of old wood. The wood had rotted. Some of the ties were gone. Far down a river roared in the dark, and far ahead, at the end of the trestle, there was daylight.",
"They left the handcar and went out onto the trestle on foot.",
"At the far end, in the light, with his hood up, the man in black was waiting.",
"— Come on, gunslinger, he called. Come on. The door’s open. Bring the boy, if you like.",
"The boy stepped on a tie, and the tie was not there.",
{drop:true},
{k:[
 "The gunslinger did not look down. He got up and went on across the trestle toward the light. When he came out into it the man in black was gone on ahead, and the prints went on.",
 "The gunslinger looked down. There was nothing to see: the dark, and the sound of the river. He looked a long time. Then he got up and went on across toward the light, and the man in black was gone on ahead, and the prints went on."
]},
{end:4}
]},

/* ===== CHAPTER FIVE — THE GUNSLINGER AND THE DARK MAN ===== */
{id:"5.1",title:"The Golgotha",kind:"road",art:"golgotha",amb:"wind",items:[
"On the far side of the mountains the gunslinger came down into a place of bones.",
"It was a round hollow among the rocks, like the inside of a bowl, and the floor of it was white. Bones. Old ones, older than Tull, older than Gilead, bones of things he knew and things he did not, piled and scattered and drifted like snow. A place of the skull.",
"In the middle of it, on a rock, sat the man in black.",
"— Gunslinger, he said. Good evening. Sit. You’ve come a long way, and you’ve paid your fare, and there is a great deal to talk about.",
{c:"sit5",opts:[
 ["Sit across from him",["The gunslinger sat down across from him. It was the first time in all the long chase that they had been near enough to touch."]],
 ["Stand",["The gunslinger stood. The man in black shrugged, courteously, as if a guest had declined a chair."]]
]},
{c:"gun5",opts:[
 ["Keep the gun drawn",["He kept the gun in his hand. The man in black glanced at it the way a man glances at weather."]],
 ["Holster it",["He put the gun away. It had been no use on the mountain and it would be no use here, and they both knew it."]]
]},
"— Wood, the man in black said. Would you fetch us some wood? It gets cold here at night. It’s the altitude."
]},
{id:"5.2",title:"The Rabbit",kind:"road",art:"golgothafire",amb:"fire",items:[
"The gunslinger gathered wood among the bones. When he came back the man in black passed a hand over it, and it caught, and burned with a clean blue flame that smelled of some sweet resin.",
"There was a rabbit on a spit. The gunslinger had not seen it arrive. It was done, brown and dripping.",
"— Eat, the man in black said.",
{c:"eat",opts:[
 ["“I’ll eat my own.”",["— I’ll eat my own, the gunslinger said, and took jerky from his purse and ate it. The man in black ate the rabbit delicately, with his fingers, and licked them."]],
 ["“What’s in it?”",["— What’s in it?","— Rabbit, said the man in black, hurt.","The gunslinger ate his jerky. The man in black ate the rabbit."]],
 ["Say nothing",["The gunslinger took jerky from his purse and ate it. The man in black ate the rabbit himself, and did not seem to mind, and did not seem surprised."]]
]},
"Then the man in black put back his hood.",
"He was handsome. That was the strangest thing. The gunslinger had expected something, a ruin, a horror, and it was only a man, dark-haired and shaggy, with a pleasant face that might have been any age, and very merry eyes.",
"— I am nearly immortal, he said, as if he had been asked. It is less pleasant than you would think. You won’t see the sun come up for a long while, gunslinger. Shall we begin?"
]},
{id:"5.3",title:"Seven Cards",kind:"road",art:"golgothafire",amb:"fire",sigil:"CR-11",items:[
"He took out a pack of cards. They were old and soft and larger than any cards the gunslinger had seen, and he shuffled them with long fingers.",
"— Your fortune, he said. Truly. I’ve looked forward to this.",
{tarot:true},
"— That’s all, the man in black said, dusting his hands. The rest you’ll have to find out the ordinary way."
]},
{id:"5.4",title:"Let There Be",kind:"road",art:"black",amb:"none",items:[
"The gunslinger came up off the ground at him.",
"The man in black said a word.",
{vision:true},
"He came back to himself on his face among the bones, with the fire burning low and the man in black sitting where he had sat, watching him. There was no merriment in his eyes now at all."
]},
{id:"5.5",title:"Palaver",kind:"road",art:"embers",amb:"fire",sigil:"CR-12",items:[
"They talked. The night went on and on, and they talked through all of it.",
"— Your name, the gunslinger said.",
"— Walter, said the man in black. It’s as good as any.",
{c:"askfirst",opts:[
 ["Ask about Marten",["— Marten, the gunslinger said.","— Ah. Marten. My master. You thought I was the one who went to your mother? No. I only held the door. I am Marten’s creature, gunslinger, and have been since before you were weaned."]],
 ["Ask who he serves",["— Who do you serve?","— Marten, first. And Marten serves another. You haven’t heard of him. The Ageless Stranger, they call him, in the places where they call him anything. His name is Maerlyn."]],
 ["Ask what stands at the top",["— What stands at the top of it?","— Not at the top. Below the top. The Beast. The keeper of the Tower. I have never seen it. Maerlyn has. He doesn’t speak of it."]],
 ["Ask about the Tower",["— The Tower, the gunslinger said.","— Always the Tower. Very well. It stands at the center of everything, gunslinger. Every world. Every when. It is the nail they all hang on."]]
]},
"The man in black laid out the order of it then, patiently, as a tutor gives a slow boy his letters. He, Walter, served Marten. Marten served the Ageless Stranger, who was Maerlyn. The Stranger served the Beast, and the Beast kept the Tower, and what waited in the Tower, at the top of the stair, in the room at the top, no one knew.",
"— You’ll have to kill the Beast, the man in black said. And before the Beast, the Stranger. And before him, well. You’re good at that part.",
"He talked about size. About how the world was only a grain in something larger, and that a grain in something larger again, and on, up and down, without end. The gunslinger understood perhaps a tenth of it and remembered all of it.",
"Toward what should have been morning, the gunslinger asked the question he had carried the longest.",
"— Do I reach it? he said. At the end of all this. Do I win?",
"The man in black looked at him a long time. Then he laughed, not unkindly.",
"— Ask me something I know, he said."
]},
{id:"5.6",title:"West",kind:"road",art:"embersdie",amb:"fire",items:[
"— Go west, the man in black said. Twenty miles, no more. You’ll come to the sea. Sit down there and wait. You’ll be given the drawing. Three will come to you, and you’ll draw them, the way you draw a gun.",
"— And you?",
"— I’ll be here. Resting.",
"The fire was very low. The gunslinger found he could not keep his eyes open. He tried. The man in black watched him try, smiling.",
"— Sleep, gunslinger, he said. Let there be light."
]},
{id:"5.7",title:"Ten Years",kind:"road",art:"bones",amb:"wind",sigil:"CR-13",items:[
"He woke cold.",
"The fire was ash, and the ash was old, crusted over like the desert’s crust. The light was grey. It was morning, or it was some morning.",
"He sat up, and his body told him it had been lying there a long time. His hands were an old man’s hands. His hair, when he pulled it forward, was grey. Ten years, he thought. He did not know how he knew it. Ten years, and he had not died of them.",
"Across the dead fire, where the man in black had sat, there was a skeleton.",
"It lay on its back in the rags of a black robe, and the robe had rotted, and the bones had gone the colour of all the other bones in that place. It had been a long time dead. It had been Walter.",
"The gunslinger looked at it for a while. He did not doubt it. He had come too far to doubt it.",
{c:"jaw5",opts:[
 ["Take the jawbone",["He knelt and broke the jawbone from the skull, carefully, the way you break a stick for kindling, and put it in his pocket."]],
 ["Leave the bones whole",["He meant to leave them whole. Then he knelt and broke the jawbone from the skull after all, and put it in his pocket."]]
]},
{jaw:true}
]},
{id:"5.8",title:"The Western Sea",kind:"road",art:"sea",amb:"sea",sigil:"CR-14",items:[
"He walked west.",
"The land went down in long steps of rock and then sand, and there was a sound he had never heard and a smell he had never smelled, and then he came over the last rise and it was there.",
"The sea. Grey-green and enormous under a low sun, coming in and going out, coming in and going out, as if the world were breathing.",
"He went down to the edge of it and sat in the sand with the guns across his knees and his hat pulled low, and watched the sun go down into the water.",
"He thought of the boy. He let himself. It was the first time.",
"Then he thought of nothing. The sun went down, and the light went lavender and then grey, and somewhere out over the water, or in his head, he saw it.",
"The Tower. Far and faint and dark against the last of the sky, standing up out of the clouds, the way it stood in the dreams he had never told anyone.",
"He sat on the shore and dreamed of it while the light went. The drawing would come. The three would come. He would wait.",
{end:5}
]}

];
